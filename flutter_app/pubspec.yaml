name: poultry_monitoring
description: A Flutter app for poultry monitoring and disease detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Image & File handling
  image_picker: ^1.0.5
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  
  # Utils
  intl: ^0.18.1
  share_plus: ^10.0.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets (uncomment when you add images)
  # assets:
  #   - assets/images/
  
  # Fonts (uncomment when you add custom fonts)
  # fonts:
  #   - family: Roboto
  #     fonts:
